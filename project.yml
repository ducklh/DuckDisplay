name: DuckDisplay
options:
  bundleIdPrefix: io.ducklh
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsMultipleScenes: YES
targets:
  DuckDisplay:
    type: application
    platform: iOS
    sources:
      - path: DuckDisplay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ducklh.duckdisplay
        PRODUCT_NAME: DuckDisplay
        INFOPLIST_KEY_CFBundleDisplayName: DuckDisplay
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
    scheme:
      gatherCoverageData: false
      testTargets:
        - DuckDisplayTests
  DuckDisplayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DuckDisplayTests
    dependencies:
      - target: DuckDisplay
